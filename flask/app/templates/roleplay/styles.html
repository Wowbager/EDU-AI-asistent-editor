<style>
    
/* ==========================================================================
    Roleplay Application Unified Styles
    ========================================================================== */

    /* Base & Layout Styles */
    body {
        overflow-y: auto !important;
    }

    /* Navigation Styles */
    .navbar-brand {
        color: #007bff !important;
    }

    .nav-link {
        transition: color 0.2s ease;
    }

    .nav-link:hover {
        color: #007bff !important;
        transform: translateY(-1px);
    }

    .navbar-text {
        color: #6c757d !important;
        font-size: 0.9rem;
    }

    /* Chat Container Styles */
    #roleplay-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 80px);
        overflow-x: hidden;
    }

    #roleplay-container > nav,
    #roleplay-container > .row:nth-child(2),
    #roleplay-container > .row:nth-child(3) {
        flex-shrink: 0;
    }

    #setup-container,
    #chat-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        min-height: 0;
    }

    #chat-container .card-header {
        flex-shrink: 0;
    }

    #chat-container .card-header .d-flex > #role-display {
        flex-shrink: 1;
        flex-grow: 1;
        min-width: 0;
    }

    #chat-container .card-body {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        padding: 1rem;
        overflow-x: hidden;
        min-height: 0;
    }

    .chat-log-scrollable {
        flex-grow: 1;
        overflow-y: auto;
        padding: 0.75rem;
        border: 1px solid #e0e0e0;
        background-color: #f8f9fa;
        min-height: 0;
        word-break: break-word;
    }

    #chat-input-group {
        padding: 0.75rem 0;
        border-top: 1px solid #e0e0e0;
        flex-shrink: 0;
        background-color: #ffffff;
    }

    #chat-input-group > textarea {
        margin-right: 0.5rem;
    }

    #chat-input-group > textarea#msg-input {
        height: 50px !important;
        min-height: 50px !important;
        max-height: 50px !important;
        overflow-y: auto !important;
        resize: none !important;
    }

    #char-counter {
        padding: 0.25rem 0.75rem;
        text-align: right;
        font-size: 0.75rem;
        flex-shrink: 0;
    }

    #send-btn {
        height: 50px !important;
    }

    /* Teams Page Styles */
    .team-metric-card {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        border: 1px solid #dee2e6;
        border-radius: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .team-metric-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .metric-icon {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }

    .metric-value {
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 0.25rem;
    }

    .btn-link:hover {
        background-color: rgba(0,0,0,0.05);
    }

    /* Flagged Messages Styles */
    .message-container {
        margin-bottom: 15px;
    }

    .message {
        padding: 10px;
        border-radius: 5px;
    }

    .message p {
        margin-bottom: 0.25rem;
    }

    .flagged-message {
        border: 2px solid red !important;
        background-color: #ffebeb;
    }

    .flagged-message-preview {
        border: 2px solid orange !important;
        background-color: #fff3e0;
    }

    .flagged-preview-content {
        overflow-x: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
        color: #6c757d;
        font-style: italic;
        font-size: 0.9em;
    }

    .flagged-container {
        scroll-margin-top: 100px;
        position: relative;
    }

    .flagged-container::before {
        content: "";
        position: absolute;
        left: -15px;
        top: 0;
        bottom: 0;
        width: 5px;
        background-color: red;
        border-radius: 2px;
    }

    .flagged-messages-container {
        max-height: 85vh;
        overflow-y: auto;
        padding-bottom: 30px;
    }

    .flagged-header {
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .flagged-header:hover {
        background-color: #f0f0f0;
    }

    .toggle-icon {
        transition: transform 0.3s ease;
        display: inline-block;
    }

    .flagged-header.collapsed .toggle-icon {
        transform: rotate(-90deg);
    }

    .collapse {
        transition: height 0.35s ease;
    }

    .collapsing {
        transition: height 0.35s ease !important;
    }

    #flagged-messages-accordion .card-body {
        padding: 1.25rem;
    }

    /* Form Styles */
    .form-label.fw-bold {
        color: #495057;
        margin-bottom: 0.5rem;
    }

    .form-control:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .btn-group-vertical .btn {
        margin-bottom: 0.25rem;
    }

    .btn-group-vertical .btn:last-child {
        margin-bottom: 0;
    }

    /* Card Styles */
    .card {
        border: none;
        border-radius: 8px;
    }

    .card-header {
        border-radius: 8px 8px 0 0 !important;
        border-bottom: 1px solid rgba(0,0,0,0.125);
    }

    .card-body {
        border-radius: 0 0 8px 8px;
    }

    .shadow-sm {
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075) !important;
    }

    /* Alert Styles */
    .alert {
        border: none;
        border-radius: 6px;
        border-left: 4px solid;
    }

    .alert-success {
        border-left-color: #28a745;
        background-color: #d4edda;
        color: #155724;
    }

    .alert-danger {
        border-left-color: #dc3545;
        background-color: #f8d7da;
        color: #721c24;
    }

    .alert-warning {
        border-left-color: #ffc107;
        background-color: #fff3cd;
        color: #856404;
    }

    .alert-info {
        border-left-color: #17a2b8;
        background-color: #d1ecf1;
        color: #0c5460;
    }

    /* Button Styles */
    .btn {
        border-radius: 6px;
        transition: all 0.2s ease;
    }

    .btn:hover {
        transform: translateY(-1px);
    }

    .btn-primary {
        background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        border: none;
        color: #ffffff !important;
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
        color: #ffffff !important;
    }

    .btn-outline-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0, 123, 255, 0.25);
    }

    /* Fix contrast for buttons on dark backgrounds */
    .bg-primary .btn,
    .card-header.bg-primary .btn,
    .navbar .btn {
        color: #ffffff !important;
        border-color: rgba(255, 255, 255, 0.3) !important;
    }

    .bg-primary .btn:hover,
    .card-header.bg-primary .btn:hover,
    .navbar .btn:hover {
        background-color: rgba(255, 255, 255, 0.1) !important;
        border-color: rgba(255, 255, 255, 0.5) !important;
        color: #ffffff !important;
    }

    .bg-primary .btn:focus,
    .card-header.bg-primary .btn:focus,
    .navbar .btn:focus {
        box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25) !important;
        color: #ffffff !important;
    }

    /* Remove the broad link override and replace with specific button overrides */
    /* Override app.css specifically for buttons in button groups and primary contexts */
    .btn-group .btn,
    .btn-group .btn:hover,
    .btn-group .btn:focus,
    .btn-group .btn:active,
    .btn-group .btn:visited {
        text-decoration: none !important;
    }

    /* Super specific overrides for primary buttons - these should override app.css */
    a.btn.btn-primary,
    a.btn.btn-primary:hover,
    a.btn.btn-primary:focus,
    a.btn.btn-primary:active,
    a.btn.btn-primary:visited,
    button.btn.btn-primary,
    button.btn.btn-primary:hover,
    button.btn.btn-primary:focus,
    button.btn.btn-primary:active {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Button group specific overrides */
    .btn-group a.btn.btn-primary,
    .btn-group a.btn.btn-primary:hover,
    .btn-group a.btn.btn-primary:focus,
    .btn-group a.btn.btn-primary:active,
    .btn-group a.btn.btn-primary:visited,
    .btn-group button.btn.btn-primary,
    .btn-group button.btn.btn-primary:hover,
    .btn-group button.btn.btn-primary:focus,
    .btn-group button.btn.btn-primary:active {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Very specific override for links with btn-primary class */
    a[href].btn-primary,
    a[href].btn-primary:hover,
    a[href].btn-primary:focus,
    a[href].btn-primary:active,
    a[href].btn-primary:visited {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    .btn-primary,
    .btn-primary:hover,
    .btn-primary:focus,
    .btn-primary:active,
    .btn-primary:visited {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Specific override for primary buttons that might be affected by app.css */
    .btn.btn-primary,
    .btn.btn-primary:hover,
    .btn.btn-primary:focus,
    .btn.btn-primary:active {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Ensure white text on primary buttons in button groups */
    .btn-group .btn-primary,
    .btn-group .btn-primary:hover,
    .btn-group .btn-primary:focus,
    .btn-group .btn-primary:active {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Nuclear option - target any element with both btn and btn-primary classes */
    *[class*="btn"][class*="btn-primary"],
    *[class*="btn"][class*="btn-primary"]:hover,
    *[class*="btn"][class*="btn-primary"]:focus,
    *[class*="btn"][class*="btn-primary"]:active,
    *[class*="btn"][class*="btn-primary"]:visited {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    /* Fix any Bootstrap override issues */
    .btn-primary:not(:disabled):not(.disabled):active,
    .btn-primary:not(:disabled):not(.disabled).active,
    .show > .btn-primary.dropdown-toggle {
        color: #ffffff !important;
    }

    /* Badge Styles */
    .badge {
        border-radius: 4px;
        font-size: 0.75em;
        padding: 0.375em 0.5em;
    }

    /* Modal Styles */
    .modal-content {
        border: none;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
        border-bottom: 1px solid #e9ecef;
        border-radius: 8px 8px 0 0;
    }

    .modal-footer {
        border-top: 1px solid #e9ecef;
        border-radius: 0 0 8px 8px;
    }

    /* List Group Styles */
    .list-group-item {
        border: none;
        border-bottom: 1px solid #e9ecef;
        padding: 1rem 0;
    }

    .list-group-item:last-child {
        border-bottom: none;
    }

    .list-group-flush .list-group-item {
        border-left: none;
        border-right: none;
    }

    /* Pagination Styles */
    .pagination .page-link {
        border-radius: 6px;
        margin: 0 2px;
        border: 1px solid #dee2e6;
        color: #007bff;
    }

    .pagination .page-link:hover {
        background-color: #e9ecef;
        border-color: #007bff;
    }

    .pagination .page-item.active .page-link {
        background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        border-color: #007bff;
    }

    /* Responsive Design */
    @media (max-width: 767.98px) {
        #roleplay-container {
            height: calc(100vh - 56px);
            overflow: scroll;
        }
        
        #chat-container .card-body {
            padding: 0.75rem;
            overflow: scroll;
        }

        .chat-log-scrollable {
            padding: 0.5rem;
        }

        #chat-input-group {
            padding: 0.5rem 0;
        }
        
        .btn-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .card-header h1,
        .card-header h5 {
            font-size: 1.1rem;
        }
    }

    @media (max-width: 575.98px) {
        #setup-container .d-flex.mb-3 {
            flex-direction: column;
        }
        
        #setup-container .d-flex.mb-3 button {
            width: 100%;
            margin-right: 0 !important;
            margin-bottom: 0.5rem;
        }
        
        #setup-container .d-flex.mb-3 button:last-child {
            margin-bottom: 0;
        }
        
        .modal-dialog {
            margin: 1rem;
        }
        
        .container {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }
    }

    /* Animation Utilities */
    .fade-in {
        animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .slide-down {
        animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Utility Classes */
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .border-left-primary {
        border-left: 4px solid #007bff !important;
    }

    .border-left-success {
        border-left: 4px solid #28a745 !important;
    }

    .border-left-warning {
        border-left: 4px solid #ffc107 !important;
    }

    .border-left-danger {
        border-left: 4px solid #dc3545 !important;
    }

    .bg-gradient-primary {
        background: linear-gradient(135deg, #007bff 0%, #0056b3 100%) !important;
    }

    .bg-gradient-success {
        background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%) !important;
    }

    .bg-gradient-warning {
        background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%) !important;
    }

    .bg-gradient-danger {
        background: linear-gradient(135deg, #dc3545 0%, #c82333 100%) !important;
    }

    /* Loading States */
    .btn.loading {
        position: relative;
        color: transparent !important;
    }

    .btn.loading::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 50%;
        left: 50%;
        margin-left: -8px;
        margin-top: -8px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Focus States */
    .form-control:focus,
    .btn:focus,
    .nav-link:focus {
        outline: 2px solid #007bff;
        outline-offset: 2px;
    }

    /* High Contrast Mode Support */
    @media (prefers-contrast: high) {
        .card {
            border: 2px solid #000;
        }
        
        .btn-outline-primary {
            border-width: 2px;
        }
        
        .alert {
            border-width: 2px;
        }
    }

    /* Print Styles */
    @media print {
        .navbar,
        .btn,
        .modal,
        #chat-input-group {
            display: none !important;
        }
        
        .card {
            border: 1px solid #000 !important;
            box-shadow: none !important;
        }
        
        .chat-log-scrollable {
            overflow: visible !important;
            max-height: none !important;
        }
    }

    i.fas {
        margin-right: 5px;
    }
</style>
